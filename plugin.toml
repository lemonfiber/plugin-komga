#:schema https://raw.githubusercontent.com/lemonfiber/lemonfiber/c33ce3863e797769ae3da11d02ec9b0945369041/contract/plugin-manifest.schema.json
# Komga, as a lemonfiber plugin.
#
# Contract: https://github.com/lemonfiber/spec/blob/main/20-architecture/contracts/plugin-manifest.md
#
# Everything lemonfiber does on this plugin's behalf comes from this file, and it
# knows nothing about the plugin that is not declared here (ARCH-R83). Nothing in
# it is executable, and nothing in it can be (F3-R1, F3-R6).

schema_version = 1

[plugin]
id          = "komga"
name        = "Komga"
version     = "1.1.0"
description = "Reads comics, manga and magazines in a browser, and serves them to the reader apps you already use"
without_it  = "Comics stay folders of images, opened one file at a time with nothing remembering where you were"
upstream    = "https://github.com/gotson/komga"
license     = "MIT"
forms       = ["library", "full"]

# The two forms that serve a library rather than acquire one. `library` runs
# without a single third-party account, which is exactly what this is; `full` is
# the lot. Neither `books` nor `auto` is named: those acquire, and this acquires
# nothing.

[[service]]
id     = "komga"
name   = "Komga"
image  = "ghcr.io/gotson/komga"
# What actually runs (F3-R8, ARCH-R95). `tag` is the readable name for this
# digest and is never resolved.
digest = "sha256:6c2a967bbe9acefd05933b2eb498f34afe96a83c6f7f8ab0acb512a1bb3ab50f"
tag    = "1.26.3"
port   = 25600
# A household service: the point of it is the tablet on the sofa. The tier is
# all this may say — the address is lemonfiber's to assign (ARCH-R88), and so is
# whether it is reachable by name at all (ARCH-R104).
bind   = "lan"
# Spring Boot, and slow to start: 20.6s to open its listener on a warm machine
# with the image already pulled. The budget matches the bundled media server's.
health = { kind = "http", path = "/actuator/health", timeout_s = 120 }
criticality = "enhancing"

# The library half. `takes_data` mounts the data root; `media_types` is what
# points this at the part of it that is comics, rather than leaving the operator
# to find /data/media/comics in Komga's own settings on first run. The vocabulary
# gained `comics` for exactly this — see lemonfiber-media-stack#79.
takes_data  = true
media_types = ["comics"]

# Komga reads KOMGA_CONFIGDIR=/config, which is also the default, so this line
# changes nothing for this plugin. It is here because it is load-bearing for the
# next author and free to state: the generated container mounts one directory,
# and this says where the image expects to find it.
config_path = "/config"

# The adapter that speaks lemonfiber's contracts in front of Komga, as the
# administrator lemonfiber mints for it (ARCH-R315, ARCH-R328).
[[service]]
id          = "komga-adapter"
name        = "Komga adapter"
image       = "ghcr.io/lemonfiber/komga-adapter"
digest      = "sha256:15afc56893fa8d9d2ac2290da8e8fac03afe8bff4abbfc31d66c58ecb49a4ac5"
tag         = "main-59bad014b64a"
criticality = "enhancing"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's owner.claim and media.serve contracts by calling Komga, beside it, as the administrator lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["owner.claim@1", "media.serve@1"]
fronts      = "komga"
provides    = ["media.serve"]
media_types = ["comics"]
upstream    = { username = { secret = "admin-email" }, password = { secret = "admin-password" } }

[[secret]]
id     = "admin-email"
of     = "komga"
minted = "email"
why    = "The address of the administrator Komga is claimed for, in the shape Komga's claim accepts, which the adapter in front of it signs in as"

[[secret]]
id     = "admin-password"
of     = "komga"
minted = "password"
why    = "The password of the administrator Komga is claimed for, which the adapter in front of it signs in with"

# A list, and one entry, because wiring is a fact about a service rather than
# about a plugin (ARCH-R127). This plugin declares two services, so the entry
# says which one the household reaches.
[[wiring]]
service         = "komga"
# Where the household reaches it once Caddy is running. A label in front of the
# operator's own domain, never an address — comics.example.com rather than
# komga.example.com, because the household knows what it went there for and not
# what the software is called.
hostname        = "comics"
dashboard_group = "Library"

[requires]
capabilities = ["doctor.contribute"]

# ─── Proofs ──────────────────────────────────────────────────────────────────
#
# Every one asserts a body. A status is a claim about the network path and not
# about the service: Docker publishes a port by putting a proxy in front of it,
# and that proxy accepts a connection before knowing whether anything inside is
# listening (ARCH-R105).

[[proof]]
id      = "komga.serves"
service = "komga"
title   = "Komga answers as Komga on its declared health path"
fixture = "fixtures/actuator-health.json"
why     = """
The health probe the manifest declares is what lifecycle waits on, so the first
proof is that the path in the manifest is a path this image serves. The body is
asserted because the status is not evidence: a container replaced by
`sleep infinity` publishes the same open port.
"""
request = { method = "GET", path = "/actuator/health" }
expect  = { status = 200, json = { status = "UP" } }

[[proof]]
id      = "komga.answers-as-itself"
service = "komga"
title   = "The Komga API is mounted and reports its own claim state"
fixture = "fixtures/api-v1-claim.json"
why     = """
A health endpoint proves a process. This proves it is *this* process:
`/api/v1/claim` is Komga's own, answers an anonymous caller, and returns a
boolean about whether an administrator has been created yet. Something else
serving port 25600 does not answer it.
"""
request = { method = "GET", path = "/api/v1/claim" }
expect  = { status = 200, json_has_keys = ["isClaimed"], json_types = { isClaimed = "bool" } }

[[proof]]
id      = "komga.library-is-guarded"
service = "komga"
title   = "An anonymous reader on the LAN cannot list the libraries"
fixture = "fixtures/api-v1-libraries-anonymous.json"
why     = """
This service declares `bind = "lan"` and a `[[wiring]]` `hostname`, which together put
it in front of every device on the household network under a name they can
remember. What makes that safe is Komga refusing an unauthenticated read, and
nothing else here would notice if it stopped: the health probe would still pass,
the API would still answer, and the library list would be public.

A refusal is the pass. This fails if it ever returns 200.
"""
request = { method = "GET", path = "/api/v1/libraries" }
expect  = { status = 401 }

[[proof]]
id      = "komga.opds-is-mounted-and-guarded"
service = "komga"
title   = "The OPDS catalogue is served, and refuses a reader who presents nothing"
fixture = "fixtures/opds-catalog-anonymous.json"
why     = """
The OPDS catalogue is the door a reading app uses rather than a person, and
nothing else here would notice if it stopped refusing a reader who presents
nothing.

Komga answers an unauthenticated OPDS request with an OPDS **authentication
document** — a body naming the scheme a reader should use — rather than with a
login page or a 404. That single response establishes both halves at once: the
catalogue is mounted, and it is not readable by the household network.
"""
request = { method = "GET", path = "/opds/v2/catalog" }
expect  = { status = 401, content_type = "application/opds-authentication+json", json_has_keys = ["authentication", "title"] }

# ─── Contributions ───────────────────────────────────────────────────────────
#
# A row in a register lemonfiber already runs, never an interpreter of its own
# (F3-R26). The doctor already runs checks independently, bounds each one, keeps
# `unverified` distinct from `pass`, and carries a remedy on anything that does
# not pass. This is one more row in it, attributed to this plugin wherever it
# appears. Whether Komga has an administrator is owner.claim's own doctor check,
# asked of the adapter (ARCH-R329).
#
# It asks something no credential is needed for, and deliberately: a check that
# quietly never runs is worse than one that fails.

[[contribution]]
at        = "doctor.check"
id        = "komga:opds-guarded"
service   = "komga"
title     = "The OPDS catalogue is not readable by the household network"
category  = "network"
timeout_s = 10
fixture   = "fixtures/opds-catalog-anonymous.json"
why       = """
The proof above asks this once, at install. This asks it every time the doctor
runs, which is when it matters: an upgrade, a settings change or a reverse proxy
in front of the service are all ways for it to stop refusing what it used to
refuse, and OPDS is the door a reading app uses rather than a person.
"""
request   = { method = "GET", path = "/opds/v2/catalog" }
expect    = { status = 401 }

[[contribution]]
at     = "doctor.remedy"
id     = "komga:close-the-catalogue"
for    = "komga:opds-guarded"
action = "Stop Komga and check what is in front of it before starting it again"
why    = """
The OPDS catalogue is readable without signing in, which means every phone,
tablet and reading app on the household network can list and download the
library.
"""
detail = """
Komga refuses this read on a default install, so the usual cause is something in
front of the service rather than the service itself: a reverse proxy configured
to strip the Authorization header, or a second route to it that lemonfiber did
not write.
"""
